apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
//apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'

def config = rootProject.extensions.getByName("ext")
android {
    compileSdkVersion 34
    buildToolsVersion "28.0.3"
    defaultConfig {
        applicationId "com.vkm.reportahealth"
        namespace "com.vkm.reportahealth"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 3
        versionName "1.0.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }
    buildFeatures {
        viewBinding true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    jvmToolchain(17)
}
dependencies {
    def nav_version = "2.8.5" // Modern stable version for 2026
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    implementation fileTree(dir: 'libs', include: ['*.jar'])
//kotlin
    implementation config.commonDependency.kotlin
    implementation config.commonDependency.kotlinCoroutine

    //testing
    implementation config.commonDependency.jUnit
    implementation config.commonDependency.testRunner
    implementation config.commonDependency.espressoCore

    //AndroidX
    implementation config.commonDependency.supportLib
    implementation config.commonDependency.designSupportLib
    implementation config.commonDependency.constraintLayout

    // utils
    implementation config.commonDependency.calligraphy
    implementation 'com.pnikosis:materialish-progress:1.7'

    // Architecture Components
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation config.room.runtime
    implementation "androidx.appcompat:appcompat:1.6.1"
//    implementation 'androidx.appcompat:appcompat:1.0.0-alpha1'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
//    implementation 'androidx.legacy:legacy-support-v4:1.0.0-alpha1'
    kapt config.room.compiler
    implementation config.commonDependency.lifecycleExt

    // DI
    implementation config.commonDependency.dagger
    kapt config.commonDependency.daggerCompiler
    implementation config.commonDependency.daggerAndroid
    implementation config.commonDependency.daggerAndroidSupport
    kapt config.commonDependency.daggerAndroidCompiler

    // Networking
    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"

    // OkHttp
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"


//    implementation config.retrofit.core
//    implementation config.retrofit.coroutineAdapter
//    implementation config.retrofit.gsonConverter

    // Play Services
    implementation config.playServices.maps
    implementation config.playServices.location
    implementation 'com.google.android.libraries.places:places:2.0.0'


    implementation "com.android.volley:volley:1.2.1"


    //firebase
    implementation platform("com.google.firebase:firebase-bom:32.7.0")
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.firebase:firebase-crashlytics"

    // Koin
    implementation "io.insert-koin:koin-android:3.5.6"
//    implementation "org.koin:koin-core:$koin_version"
//    implementation "org.koin:koin-android:$koin_version"
//    implementation "org.koin:koin-android-viewmodel:$koin_version"

    // MaterialIcons
//    implementation 'net.steamcrafted:materialiconlib:1.1.4'

    // Google Direction Libs6
    implementation 'com.akexorcist:googledirectionlibrary:1.1.1'

    // Charts
//    implementation 'com.github.razerdp:AnimatedPieView:1.2.5'
    implementation 'com.github.blackfizz:eazegraph:1.2.2@aar'
    implementation 'com.nineoldandroids:library:2.4.0'

    // Parceller
    implementation 'org.parceler:parceler-api:1.1.12'
    kapt 'org.parceler:parceler:1.1.12'

    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'com.squareup.okhttp3:okhttp:3.10.0'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:3.4.2'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.10.0'
    implementation 'com.android.support:multidex:1.0.3'
//    implementation 'com.crashlytics.sdk.android:crashlytics:2.10.1'

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

// Room
    implementation "androidx.room:room-runtime:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

// WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.0"


}
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

