// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        kotlin_version = '2.3.0'
        coroutineVersion = '1.0.0'
        compileSdkVersion = 28
        targetSdkVersion = 28
        minSdkVersion = 19
        appCompatVer = '1.1.0-alpha02'
        designLibVer = '1.1.0-alpha03'
        constraintLayoutVer = '1.1.3'
        recyclerViewVer = '1.0.0'
        jUnitVer = '4.12'
        testRunnerVer = '1.0.2'
        espressoCoreVer = '3.0.2'
        firebaseVer = '17.0.0'
        circleImageViewVer = '2.2.0'
        xwrayGroupieVer = '2.1.0'
        picassoVer = '2.71828'
        glideVer = '4.8.0'
        daggerVer = '2.16'
        lifecycleVer = '2.0.0-rc01'
        calligraphyVer = '2.3.0'
        roomVersion = '2.0.0-rc01'
        workManagerVer = '1.0.0-beta01'
        coreTestingVersion = '2.0.0-rc01'
        retrofitVersion = '2.4.0'
        playServicesVersion = '16.1.0'
        koin_version = '1.0.1'
        commonDependency = [
                kotlin               : "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${kotlin_version}",
                kotlinCoroutine      : "org.jetbrains.kotlinx:kotlinx-coroutines-android:${coroutineVersion}",
                supportLib           : "androidx.appcompat:appcompat:$appCompatVer",
                lifecycleExt         : "androidx.lifecycle:lifecycle-extensions:${lifecycleVer}",
                workManager          : "android.arch.work:work-runtime:$workManagerVer",
                designSupportLib     : "com.google.android.material:material:${designLibVer}",
                recyclerView         : "androidx.recyclerview:recyclerview:$recyclerViewVer",
                constraintLayout     : "androidx.constraintlayout:constraintlayout:${constraintLayoutVer}",
                jUnit                : "junit:junit:${jUnitVer}",
                testRunner           : "com.android.support.test:runner:${testRunnerVer}",
                espressoCore         : "com.android.support.test.espresso:espresso-core:${espressoCoreVer}",
                circleimageview      : "de.hdodenhof:circleimageview:${circleImageViewVer}",
                xwrayGroupie         : "com.xwray:groupie:${xwrayGroupieVer}",
                calligraphy          : "uk.co.chrisjenx:calligraphy:${calligraphyVer}",
                picasso              : "com.squareup.picasso:picasso:${picassoVer}",
                glide                : "com.github.bumptech.glide:glide:${glideVer}",
                glideCompiler        : "com.github.bumptech.glide:compiler:${glideVer}",
                dagger               : "com.google.dagger:dagger:${daggerVer}",
                daggerCompiler       : "com.google.dagger:dagger-compiler:${daggerVer}",
                daggerAndroid        : "com.google.dagger:dagger-android:${daggerVer}",
                daggerAndroidCompiler: "com.google.dagger:dagger-android-processor:${daggerVer}",
                daggerAndroidSupport : "com.google.dagger:dagger-android-support:${daggerVer}",
        ]
        // We have added "firebaseDependency" array to make grouping of firebase dependencies
        firebaseDependency = [
                firebaseCore    : "com.google.firebase:firebase-core:${firebaseVer}",
                firebaseAuth    : "com.google.firebase:firebase-auth:${firebaseVer}",
                firebaseStorage : "com.google.firebase:firebase-storage:${firebaseVer}",
                firebaseDatabase: "com.google.firebase:firebase-database:${firebaseVer}",
        ]
        room = [
                runtime : "androidx.room:room-runtime:${roomVersion}",
                compiler: "androidx.room:room-compiler:${roomVersion}"
        ]
        retrofit = [
                core: "com.squareup.retrofit2:retrofit:${retrofitVersion}",
                coroutineAdapter: "com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:0.9.2",
                gsonConverter: "com.squareup.retrofit2:converter-gson:${retrofitVersion}",
        ]
        okhttp = [
                core: "com.squareup.retrofit2:retrofit:${retrofitVersion}",
                coroutineAdapter: "com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:${retrofitVersion}",
                gsonConverter: "com.squareup.retrofit2:converter-gson:${retrofitVersion}",
        ]
        playServices = [
                'maps'    : "com.google.android.gms:play-services-maps:${playServicesVersion}",
                'location': "com.google.android.gms:play-services-location:16.0.0",
                'places'  : "com.google.android.gms:play-services-places:${playServicesVersion}"
        ]

    }
    repositories {
        google()
        mavenCentral()

    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.4.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.firebase:firebase-crashlytics-gradle:2.9.9"
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
//        jcenter()
        mavenCentral()
        maven { url "https://repo1.maven.org/maven2" }
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
