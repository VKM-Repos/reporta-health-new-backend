version: '3.9'

x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_URL: ${REDIS_URL}
  SECRET_KEY: ${SECRET_KEY}
  DEBUG: "False"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  DOMAIN: ${DOMAIN}
  USE_S3: ${USE_S3:-False}
  SPACES_ACCESS_KEY: ${SPACES_ACCESS_KEY:-}
  SPACES_SECRET_KEY: ${SPACES_SECRET_KEY:-}
  SPACES_BUCKET_NAME: ${SPACES_BUCKET_NAME:-}
  SPACES_REGION: ${SPACES_REGION:-lon1}
  SPACES_CDN_ENDPOINT: ${SPACES_CDN_ENDPOINT:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  EMAIL_HOST: ${EMAIL_HOST}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: reporta_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reporta_redis
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: reporta_web:latest
    container_name: reporta_web
    entrypoint: /entrypoint.sh
    environment: *app-env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    image: reporta_web:latest
    container_name: reporta_celery
    entrypoint: /entrypoint.celery.sh
    command: celery -A config.celery worker --loglevel=info
    environment: *app-env
    volumes:
      - logs_volume:/app/logs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    image: reporta_web:latest
    container_name: reporta_celery_beat
    entrypoint: /entrypoint.celery.sh
    command: >
      celery -A config.celery beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment: *app-env
    volumes:
      - logs_volume:/app/logs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: reporta_nginx
    command: >
      /bin/sh -c "envsubst '$$DOMAIN' < /etc/nginx/templates/nginx.conf.template
      > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:
  certbot_certs:
  certbot_www: